[build]
builder = "nixpacks"

[deploy]
startCommand = "gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
healthcheckPath = "/api/v1/exercises/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"

[[deploy.environmentVariables]]
# Set these in the Railway dashboard:
# SECRET_KEY, DEBUG=False, CORS_ALLOWED_ORIGINS, MEDIA_URL_BASE
# DATABASE_URL is injected automatically when you link a Postgres service
